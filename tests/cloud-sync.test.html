<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<script type="module">
  try {
    const { CloudSync } = await import("../cloud-sync.js");
    let status = null;
    let remoteApplied = false;
    const sync = new CloudSync({
      getLocalData: () => ({
        version: 1,
        updatedAt: new Date().toISOString(),
        series: [],
        projects: [],
        playlistOrder: [],
      }),
      onRemoteData: () => {
        remoteApplied = true;
      },
      onStatus: (nextStatus) => {
        status = nextStatus;
      },
    });

    sync.queue({ series: [{ id: "local-only" }] });

    const passed =
      sync.configured === true &&
      sync.state.phase === "loading" &&
      status === null &&
      remoteApplied === false;
    document.querySelector("#result").textContent = passed
      ? "PASS Firebase 設定を認識し、認証前は同期しない"
      : `FAIL configured=${sync.configured} phase=${sync.state.phase} remote=${remoteApplied}`;
    document.title = passed ? "PASS" : "FAIL";
  } catch (error) {
    document.querySelector("#result").textContent = `FAIL ${error.message}`;
    document.title = "FAIL";
  }
</script>
