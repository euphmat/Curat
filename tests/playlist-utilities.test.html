<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<iframe style="width: 720px; height: 800px; border: 0"></iframe>
<script src="backup-test-helper.js"></script>
<script>
  const now = "2026-07-27T00:00:00.000Z";
  const testData = {
    version: 1,
    updatedAt: now,
    playlistOrder: ["utility-series-video-dismissal"],
    recommendationDismissals: {
      playlists: ["id:hidden-playlist"],
      videos: ["id:hidden-video"],
      games: ["project:非表示ゲーム"],
      channels: ["id:hidden-channel"],
    },
    recommendationDismissalDetails: {
      playlists: [{
        key: "id:hidden-playlist",
        label: "非表示プレイリスト",
        detail: "テスト投稿者",
        thumbnail: "",
        blockedAt: now,
      }],
      games: [{
        key: "project:非表示ゲーム",
        label: "非表示ゲーム",
        detail: "",
        thumbnail: "",
        blockedAt: now,
      }],
      channels: [{
        key: "id:hidden-channel",
        label: "非表示投稿者",
        detail: "",
        thumbnail: "",
        blockedAt: now,
      }],
    },
    projects: [{ name: "テスト", aliases: [], learnedAliases: [] }],
    series: [{
      id: "utility-series-video-dismissal",
      title: "一括操作テスト",
      channelTitle: "テストチャンネル",
      project: "テスト",
      sourceUrl: "https://www.youtube.com/playlist?list=utility-series-video-dismissal",
      thumbnail: "",
      createdAt: now,
      updatedAt: now,
      tasks: [
        { id: "todo", videoId: "todo", title: "未視聴", status: "todo", archived: false },
        { id: "doing", videoId: "doing", title: "視聴中", status: "doing", archived: false },
        { id: "skipped", videoId: "skipped", title: "スキップ", status: "skipped", archived: false },
        { id: "archived", videoId: "archived", title: "アーカイブ", status: "doing", archived: true },
      ],
    }],
  };

  const frame = document.querySelector("iframe");
  const finish = (passed, detail) => {
    document.querySelector("#result").textContent = passed ? "PASS playlist utilities" : `FAIL ${detail}`;
    document.title = passed ? "PASS" : "FAIL";
  };

  frame.addEventListener("load", async () => {
    if (!frame.contentDocument.querySelector("#restoreInput")) return;
    await loadCuratTestData(frame, testData);
    const appDocument = frame.contentDocument;
    appDocument.querySelector('[data-project-series="utility-series-video-dismissal"]')?.click();

    const actions = [...appDocument.querySelectorAll(".detail-actions .detail-action-button")];
    const iconOnly =
      actions.length === 7 &&
      actions.every((action) => action.getAttribute("aria-label") && !action.textContent.trim());
    const toolbarContained =
      appDocument.querySelector(".detail-actions").scrollWidth <=
      appDocument.querySelector(".detail-actions").clientWidth + 1;

    appDocument.querySelector('[data-detail-action="complete-all"]')?.click();
    await waitForCuratTest(() => appDocument.querySelector("#confirmDialog").open);
    appDocument.querySelector("#confirmForm").requestSubmit(
      appDocument.querySelector("#confirmAction"),
    );
    await waitForCuratTest(
      () => appDocument.querySelector('[data-task-id="todo"]')?.classList.contains("is-done"),
    );
    const completedExport = await exportCuratTestData(frame);
    const completed = completedExport.series[0].tasks;
    const completedCorrectly =
      completed.find((task) => task.id === "todo").status === "done" &&
      completed.find((task) => task.id === "doing").status === "done" &&
      completed.find((task) => task.id === "skipped").status === "skipped" &&
      completed.find((task) => task.id === "archived").status === "doing";
    const dismissalsPreserved =
      completedExport.recommendationDismissals.playlists.includes("id:hidden-playlist") &&
      completedExport.recommendationDismissals.playlists.includes("id:hidden-video") &&
      !("videos" in completedExport.recommendationDismissals) &&
      completedExport.recommendationDismissals.games[0] === "project:非表示ゲーム" &&
      completedExport.recommendationDismissals.channels[0] === "id:hidden-channel";
    const dismissalDetailsPreserved =
      completedExport.recommendationDismissalDetails.playlists[0]?.label ===
        "非表示プレイリスト" &&
      completedExport.recommendationDismissalDetails.games[0]?.label ===
        "非表示ゲーム" &&
      completedExport.recommendationDismissalDetails.channels[0]?.label ===
        "非表示投稿者";

    appDocument.querySelector('[data-detail-action="reset-progress"]')?.click();
    await waitForCuratTest(() => appDocument.querySelector("#confirmDialog").open);
    appDocument.querySelector("#confirmForm").requestSubmit(
      appDocument.querySelector("#confirmAction"),
    );
    await waitForCuratTest(
      () => appDocument.querySelector('[data-task-id="todo"]')?.classList.contains("is-todo"),
    );
    const reset = (await exportCuratTestData(frame)).series[0].tasks;
    const resetCorrectly =
      reset.filter((task) => !task.archived).every((task) => task.status === "todo") &&
      reset.find((task) => task.id === "archived").status === "doing";

    appDocument.querySelector("#recommendationDialog")?.showModal();
    appDocument.querySelector("#openBlockedRecommendations")?.click();
    await waitForCuratTest(
      () => appDocument.querySelector("#blockedRecommendationDialog")?.open,
    );
    const blockedTabsCorrect =
      appDocument.querySelectorAll(
        "#blockedRecommendationTabs [data-blocked-recommendation-tab]",
      ).length === 3 &&
      appDocument.querySelector("#blockedRecommendationResults")?.textContent.includes(
        "非表示プレイリスト",
      );
    appDocument
      .querySelector("[data-blocked-recommendation-tab='games']")
      ?.click();
    await waitForCuratTest(
      () =>
        appDocument.querySelector("#blockedRecommendationResults")?.textContent.includes(
          "非表示ゲーム",
        ),
    );
    appDocument
      .querySelector(
        "#blockedRecommendationResults [data-blocked-action='unblock']",
      )
      ?.click();
    await waitForCuratTest(
      () =>
        !appDocument.querySelector(
          "#blockedRecommendationResults [data-blocked-action='unblock']",
        ),
    );
    const afterUnblock = await exportCuratTestData(frame);
    const unblockSaved =
      afterUnblock.recommendationDismissals.games.length === 0 &&
      afterUnblock.recommendationDismissalDetails.games.length === 0;
    finish(
      iconOnly &&
        toolbarContained &&
        completedCorrectly &&
        resetCorrectly &&
        dismissalsPreserved &&
        dismissalDetailsPreserved &&
        blockedTabsCorrect &&
        unblockSaved,
      `icons=${iconOnly} actions=${actions.length} contained=${toolbarContained} complete=${completedCorrectly} reset=${resetCorrectly} dismissals=${JSON.stringify(completedExport.recommendationDismissals)} details=${JSON.stringify(completedExport.recommendationDismissalDetails)} blockedTabs=${blockedTabsCorrect} unblock=${unblockSaved}`,
    );
  });
  frame.src = "../index.html";
</script>
