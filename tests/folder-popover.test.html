<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<iframe style="width: 1200px; height: 800px; border: 0"></iframe>
<script src="backup-test-helper.js"></script>
<script>
  const now = "2026-07-27T00:00:00.000Z";
  const testData = {
    version: 1,
    updatedAt: now,
    series: [{
      id: "folder-popover-series",
      title: "テストプレイリスト",
      channelTitle: "テストチャンネル",
      project: "テストフォルダー",
      thumbnail: "",
      tasks: [],
      createdAt: now,
      updatedAt: now,
    }],
    projects: [{
      name: "テストフォルダー",
      aliases: ["旧別名"],
      learnedAliases: [],
      icon: "builtin:gamepad",
    }],
    playlistOrder: ["folder-popover-series"],
  };

  const frame = document.querySelector("iframe");
  frame.addEventListener("load", async () => {
    await loadCuratTestData(frame, testData);
    setTimeout(() => {
      const appDocument = frame.contentDocument;
      const folderRow = [...appDocument.querySelectorAll("[data-tree-folder]")]
        .find((item) => item.dataset.treeFolder === "テストフォルダー");
      folderRow.dispatchEvent(new MouseEvent("contextmenu", {
        bubbles: true,
        cancelable: true,
        clientX: 220,
        clientY: 180,
      }));
      appDocument.querySelector("[data-context-action='edit-folder']").click();

      setTimeout(() => {
        const renameDialog = appDocument.querySelector("#renameFolderDialog");
        const renameForm = appDocument.querySelector("#renameFolderForm");
        const openedRenameOnly =
          !appDocument.querySelector("#folderDialog").open &&
          renameDialog.open &&
          !appDocument.querySelector("#folderIconDialog").open &&
          renameDialog.classList.contains("folder-popup-dialog") &&
          renameDialog.classList.contains("is-popup-positioned") &&
          appDocument.activeElement === appDocument.querySelector("#folderNameInput");

        const folderNameInput = appDocument.querySelector("#folderNameInput");
        folderNameInput.value = "旧";
        folderNameInput.dispatchEvent(new Event("input", { bubbles: true }));
        const suggestedAlias = Boolean(
          appDocument.querySelector(
            "#folderNameSuggestions [data-folder-name-suggestion='旧別名']",
          ),
        );

        folderNameInput.value = "新しいフォルダー名";
        folderNameInput.dispatchEvent(new Event("input", { bubbles: true }));
        renameForm.requestSubmit(appDocument.querySelector("#saveFolderName"));

        setTimeout(() => {
          const renamedRow = [...appDocument.querySelectorAll("[data-tree-folder]")]
            .find((item) => item.dataset.treeFolder === "新しいフォルダー名");
          renamedRow.dispatchEvent(new MouseEvent("contextmenu", {
            bubbles: true,
            cancelable: true,
            clientX: 220,
            clientY: 180,
          }));
          appDocument.querySelector("[data-context-action='change-folder-icon']").click();

          setTimeout(() => {
            const iconDialog = appDocument.querySelector("#folderIconDialog");
            const openedIconOnly =
              iconDialog.open &&
              !renameDialog.open &&
              iconDialog.classList.contains("folder-popup-dialog") &&
              iconDialog.classList.contains("is-popup-positioned") &&
              appDocument.activeElement === appDocument.querySelector("#folderIconSearch") &&
              appDocument.querySelectorAll("#folderIconResults [data-folder-icon]").length > 48 &&
              Boolean(
                appDocument.querySelector(
                  "#folderIconResults [data-folder-icon='game-icons:health-potion']",
                ),
              );
            appDocument.querySelector("[data-folder-icon='builtin:sword']").click();
            const livePreview = [...appDocument.querySelectorAll("[data-tree-folder]")]
              .find((item) => item.dataset.treeFolder === "新しいフォルダー名")
              ?.querySelector(".folder-color-icon")
              ?.src.includes("crossed-swords.svg");
            appDocument.querySelector("#folderIconForm")
              .requestSubmit(appDocument.querySelector("#saveFolderIcon"));

            setTimeout(async () => {
              const saved = await exportCuratTestData(frame);
              const project = saved.projects.find((item) => item.name === "新しいフォルダー名");
              const savedSeparately =
                !iconDialog.open &&
                project?.icon === "builtin:sword" &&
                project.aliases.includes("旧別名") &&
                project.aliases.includes("テストフォルダー") &&
                saved.series[0].project === "新しいフォルダー名" &&
                Boolean(renamedRow);

              const currentRenamedRow = [...appDocument.querySelectorAll("[data-tree-folder]")]
                .find((item) => item.dataset.treeFolder === "新しいフォルダー名");
              currentRenamedRow.dispatchEvent(new MouseEvent("contextmenu", {
                bubbles: true,
                cancelable: true,
                clientX: 220,
                clientY: 180,
              }));
              appDocument.querySelector("[data-context-action='change-folder-icon']").click();
              const recentPassed = Boolean(
                appDocument.querySelector(
                  "#recentFolderIcons [data-folder-icon='builtin:sword']",
                ),
              );
              const passed =
                openedRenameOnly &&
                suggestedAlias &&
                openedIconOnly &&
                livePreview &&
                savedSeparately &&
                recentPassed;

              document.querySelector("#result").textContent = passed
                ? "PASS folder name and icon use interactive anchored popups"
                : `FAIL rename=${openedRenameOnly} suggested=${suggestedAlias} icon=${openedIconOnly} preview=${livePreview} saved=${savedSeparately} recent=${recentPassed} project=${JSON.stringify(project)}`;
              document.title = passed ? "PASS" : "FAIL";
            }, 100);
          }, 50);
        }, 50);
      }, 50);
    }, 50);
  }, { once: true });
  frame.src = "../index.html";
</script>
