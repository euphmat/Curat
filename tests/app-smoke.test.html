<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<iframe src="../index.html" hidden></iframe>
<script>
  const frame = document.querySelector("iframe");
  frame.addEventListener("load", () => {
    setTimeout(() => {
      const appWindow = frame.contentWindow;
      const appDocument = frame.contentDocument;
      const checks = [
        ["分類モジュールを読み込める", Boolean(appWindow.CuratProjectMatch)],
        ["アプリの初期描画が完了する", Boolean(appDocument.querySelector(".project-empty"))],
        [
          "サービスワーカー用アセットを参照できる",
          [...appDocument.scripts].some((script) => script.src.endsWith("/project-match.js")),
        ],
        [
          "旧サイドバーナビゲーションが削除されている",
          !appDocument.querySelector(".sidebar [data-nav]"),
        ],
        [
          "エクスプローラー検索を利用できる",
          Boolean(appDocument.querySelector(".sidebar #projectSearch")),
        ],
        [
          "エクスプローラーがサイドバーの主領域になっている",
          Boolean(appDocument.querySelector(".sidebar > .project-nav")),
        ],
        [
          "フォルダー名を Enter キーで保存できる",
          appDocument.querySelectorAll("#folderForm button[type='submit']").length === 1 &&
            appDocument.querySelector("#folderForm button[type='submit']")?.id === "saveFolder" &&
            [...appDocument.querySelectorAll("#folderForm button[value='cancel']")].every(
              (button) => button.type === "button",
            ),
        ],
      ];
      const failures = checks.filter(([, passed]) => !passed).map(([name]) => name);
      document.querySelector("#result").textContent = failures.length
        ? `FAIL ${failures.join(", ")}`
        : `PASS ${checks.length}/${checks.length}`;
      document.title = failures.length ? "FAIL" : "PASS";
    }, 500);
  });
</script>
