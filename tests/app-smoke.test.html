<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<iframe hidden></iframe>
<script>
  const previousBrowserSettings = localStorage.getItem("curat-browser-settings-v1");
  localStorage.setItem(
    "curat-browser-settings-v1",
    JSON.stringify({
      apiKey: "test-api-key",
      username: "test@example.com",
      password: "test-password",
    }),
  );
  const frame = document.querySelector("iframe");
  frame.addEventListener("load", () => {
    const startedAt = Date.now();
    const runChecksWhenReady = () => {
      const appWindow = frame.contentWindow;
      const appDocument = frame.contentDocument;
      if (
        !appDocument.querySelector(".workspace-welcome, .workspace .detail-layout") &&
        Date.now() - startedAt < 4000
      ) {
        setTimeout(runChecksWhenReady, 50);
        return;
      }
      appDocument.querySelector("#newProject")?.click();
      appDocument.querySelector("[data-recommendation-tab='new-game']")?.click();
      const checks = [
        ["分類モジュールを読み込める", Boolean(appWindow.CuratProjectMatch)],
        ["並び替えモジュールを読み込める", Boolean(appWindow.CuratPlaylistOrder)],
        ["フォルダー順序モジュールを読み込める", Boolean(appWindow.CuratFolderOrder)],
        ["フォルダー表示モジュールを読み込める", Boolean(appWindow.CuratFolderDisplay)],
        ["おすすめ判定モジュールを読み込める", Boolean(appWindow.CuratRecommendations)],
        [
          "おすすめ除外用のアイコンを利用できる",
          Boolean(
            appDocument.querySelector("#icon-eye-off") &&
              appDocument.querySelector("#icon-user-x"),
          ),
        ],
        [
          "アプリの初期描画が完了する",
          Boolean(appDocument.querySelector(".workspace-welcome, .workspace .detail-layout")),
        ],
        [
          "サービスワーカー用アセットを参照できる",
          [...appDocument.scripts].some((script) => script.src.endsWith("/project-match.js")),
        ],
        [
          "プレイリスト順序のアセットを参照できる",
          [...appDocument.scripts].some((script) => script.src.endsWith("/playlist-order.js")),
        ],
        [
          "フォルダー順序のアセットを参照できる",
          [...appDocument.scripts].some((script) => script.src.endsWith("/folder-order.js")),
        ],
        [
          "旧サイドバーナビゲーションが削除されている",
          !appDocument.querySelector(".sidebar [data-nav]"),
        ],
        [
          "エクスプローラー検索を利用できる",
          Boolean(appDocument.querySelector(".sidebar #projectSearch")),
        ],
        [
          "エクスプローラーがサイドバーの主領域になっている",
          Boolean(appDocument.querySelector(".sidebar > .project-nav")),
        ],
        [
          "サイドバーの進捗率と件数表示が廃止されている",
          !appDocument.querySelector(
            ".sidebar .project-nav-head, .sidebar .project-progress, .sidebar .project-item-count, .sidebar .playlist-progress",
          ),
        ],
        [
          "右側の詳細サイドバーが完全に削除されている",
          !appDocument.querySelector(".detail-sidebar, #detailSidebar"),
        ],
        [
          "中央がプレイリスト管理ワークスペースになっている",
          Boolean(appDocument.querySelector(".main > #detailView #detailContent")),
        ],
        [
          "プレイリスト追加フォームがヘッダーにある",
          Boolean(appDocument.querySelector(".topbar > #playlistForm #playlistUrl")),
        ],
        [
          "ヘッダーの補助見出しと取り込み結果が表示されない",
          !appDocument.querySelector(".topbar-eyebrow") &&
            appDocument.querySelector("#formMessage")?.hidden,
        ],
        [
          "ヘッダー操作が読み上げ可能なアイコンボタンになっている",
          ["#playlistForm .header-add-button", "#openRecommendations", "#deleteAll"].every(
            (selector) => {
              const button = appDocument.querySelector(selector);
              return (
                button?.querySelector(".icon") &&
                !button.querySelector("span") &&
                Boolean(button.getAttribute("aria-label"))
              );
            },
          ),
        ],
        [
          "ヘッダーのチャンネル名を省略せず表示できる",
          (() => {
            const titleStyle = appWindow.getComputedStyle(appDocument.querySelector("#viewTitle"));
            return (
              titleStyle.whiteSpace !== "nowrap" &&
              titleStyle.textOverflow !== "ellipsis" &&
              titleStyle.overflow !== "hidden"
            );
          })(),
        ],
        [
          "登録済みデータからおすすめを開ける",
          Boolean(
            appDocument.querySelector("#openRecommendations") &&
              appDocument.querySelector("#recommendationDialog #recommendationResults") &&
              appDocument.querySelector("#refreshRecommendations") &&
              appDocument.querySelectorAll(
                "#recommendationTabs [data-recommendation-tab][role='tab']",
              ).length === 3 &&
              appDocument
                .querySelector("[data-recommendation-tab='new-channel']")
                ?.textContent.includes("新しい投稿者") &&
              appDocument
                .querySelector("[data-recommendation-tab='known-channel']")
                ?.textContent.includes("追加済みの投稿者") &&
              appDocument
                .querySelector("[data-recommendation-tab='new-game']")
                ?.textContent.includes("新しいゲーム"),
          ),
        ],
        [
          "おすすめタブを切り替えられる",
          appDocument
            .querySelector("[data-recommendation-tab='new-game']")
            ?.getAttribute("aria-selected") === "true" &&
            appDocument.querySelector("#recommendationResults")?.getAttribute("aria-labelledby") ===
              "recommendationTabNewGame",
        ],
        [
          "ヘッダーのメニューボタンが廃止されている",
          !appDocument.querySelector(".topbar #mobileMenu, .topbar .mobile-menu"),
        ],
        [
          "新規フォルダーを Enter キーで保存できる",
          appDocument.querySelectorAll("#folderForm button[type='submit']").length === 1 &&
            appDocument.querySelector("#folderForm button[type='submit']")?.id === "saveFolder" &&
            appDocument.querySelector("#saveFolder")?.hasAttribute("data-default-action") &&
            [...appDocument.querySelectorAll("#folderForm button[value='cancel']")].every(
              (button) => button.type === "button",
            ),
        ],
        [
          "名前変更とアイコン変更が専用ポップアップに分かれている",
          Boolean(
            appDocument.querySelector("#renameFolderDialog.folder-popup-dialog #renameFolderForm") &&
              appDocument.querySelector("#renameFolderForm #folderNameInput") &&
              appDocument.querySelector("#folderIconDialog.folder-popup-dialog #folderIconForm") &&
              !appDocument.querySelector("#renameFolderDialog #folderIconSearch") &&
              !appDocument.querySelector("#folderDialog #folderIconSearch")
          ),
        ],
        [
          "フォルダー名の近似候補を表示できる",
          Boolean(
            appDocument.querySelector("#folderNameInput[aria-autocomplete='list']") &&
              appDocument.querySelector("#folderNameSuggestions[role='listbox']"),
          ),
        ],
        [
          "フォルダーアイコンを検索し、最近使った絵文字を表示できる",
          Boolean(
            appDocument.querySelector("#folderIconSearch") &&
              appDocument.querySelector("#folderIconResults") &&
              appDocument.querySelector("#resetFolderIcon") &&
              appDocument.querySelector("#recentFolderIconsSection") &&
              appDocument.querySelector("#recentFolderIcons"),
          ),
        ],
        [
          "新規作成は画面に重なるアンカー付きポップアップで開く",
          appDocument.querySelector("#folderDialog")?.open &&
            appDocument.querySelector("#folderDialog")?.classList.contains("folder-popup-dialog") &&
            Boolean(appDocument.querySelector("#newFolderNameInput")) &&
            !appDocument.querySelector("#folderDialog .folder-icon-picker"),
        ],
        [
          "API キーを Enter キーで保存できる",
          appDocument.querySelector("#settingsForm #saveSettings")?.type === "submit" &&
            appDocument.querySelector("#saveSettings")?.hasAttribute("data-default-action") &&
            appDocument.querySelector("#settingsDialog .close-button")?.type === "button",
        ],
        [
          "Firebase 同期のログイン UI と状態表示がある",
          Boolean(
            appDocument.querySelector("#cloudLoginForm #cloudEmail") &&
              appDocument.querySelector("#cloudLoginForm #cloudPassword") &&
              appDocument.querySelector("#cloudLogin")?.type === "submit" &&
              appDocument.querySelector("#saveStatusPanel"),
          ),
        ],
        [
          "設定と保存データが同じモーダルに統合されている",
          Boolean(
            appDocument.querySelector("#settingsDialog #settingsForm #apiKeyInput") &&
              appDocument.querySelector("#settingsDialog #cloudLoginForm") &&
              appDocument.querySelector("#settingsDialog .backup-actions") &&
              !appDocument.querySelector("#backupDialog"),
          ),
        ],
        [
          "API キーとログイン情報がブラウザから復元される",
          appDocument.querySelector("#apiKeyInput")?.value === "test-api-key" &&
            appDocument.querySelector("#cloudEmail")?.value === "test@example.com" &&
            appDocument.querySelector("#cloudPassword")?.value === "test-password",
        ],
        [
          "JSON のエクスポートとインポートが残っている",
          Boolean(
            appDocument.querySelector("#downloadSave") &&
              appDocument.querySelector("#restoreSave") &&
              appDocument.querySelector("#restoreInput"),
          ),
        ],
        [
          "分類ルールを Enter キーで保存できる",
          appDocument.querySelectorAll("#projectForm button[type='submit']").length === 1 &&
            appDocument.querySelector("#saveProject")?.hasAttribute("data-default-action") &&
            appDocument.querySelector("#projectForm .close-button")?.type === "button",
        ],
        [
          "確認ダイアログの既定アクションが確定になっている",
          appDocument.querySelector("#confirmForm #confirmAction")?.type === "submit" &&
            appDocument.querySelector("#confirmAction")?.hasAttribute("data-default-action"),
        ],
      ];
      const failures = checks.filter(([, passed]) => !passed).map(([name]) => name);
      document.querySelector("#result").textContent = failures.length
        ? `FAIL ${failures.join(", ")}`
        : `PASS ${checks.length}/${checks.length}`;
      document.title = failures.length ? "FAIL" : "PASS";
      if (previousBrowserSettings === null) {
        localStorage.removeItem("curat-browser-settings-v1");
      } else {
        localStorage.setItem("curat-browser-settings-v1", previousBrowserSettings);
      }
    };
    runChecksWhenReady();
  });
  frame.src = "../index.html";
</script>
