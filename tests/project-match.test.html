<!doctype html>
<meta charset="utf-8" />
<title>project-match tests</title>
<pre id="result">running</pre>
<script src="../project-match.js"></script>
<script>
  const {
    normalizeForProjectMatch,
    phoneticKey,
    matchesProjectSearch,
    classifyProject,
    rememberLearnedAlias,
    rememberProjectAlias,
    rememberProjectCorrection,
  } = window.CuratProjectMatch;
  const failures = [];
  let assertions = 0;

  function equal(actual, expected, message) {
    assertions += 1;
    if (actual !== expected) {
      failures.push(`${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }
  }

  const projects = [
    {
      name: "ポケットモンスター",
      aliases: ["Pocket Monsters", "Pokémon"],
      learnedAliases: [],
    },
    {
      name: "ゼルダの伝説",
      aliases: ["The Legend of Zelda"],
      learnedAliases: ["Tears of the Kingdom 実況"],
    },
  ];

  equal(
    normalizeForProjectMatch("Ｐｏｋéｍｏｎ"),
    "pokemon",
    "全角・アクセントを正規化する",
  );
  equal(
    normalizeForProjectMatch("ポケット モンスター"),
    normalizeForProjectMatch("ぽけっと・もんすたー"),
    "ひらがな・カタカナ・区切りを同一視する",
  );
  equal(phoneticKey("ドラゴンクエスト"), "drgnkst", "カナを発音キーに変換する");

  const dragonQuest = classifyProject("Dragon Quest 実況 #1", [
    { name: "ドラゴンクエスト", aliases: [], learnedAliases: [] },
  ]);
  equal(dragonQuest.projectName, "ドラゴンクエスト", "日本語名を英語タイトルと照合する");
  equal(dragonQuest.matchType, "fuzzy", "日英の発音一致は近似一致として扱う");

  const reverseDragonQuest = classifyProject("ドラゴンクエスト 実況 #1", [
    { name: "Dragon Quest", aliases: [], learnedAliases: [] },
  ]);
  equal(reverseDragonQuest.projectName, "Dragon Quest", "英語名を日本語タイトルと照合する");

  const fireEmblem = classifyProject("Fire Emberem Engage", [
    { name: "ファイアーエムブレム", aliases: [], learnedAliases: [] },
  ]);
  equal(fireEmblem.projectName, "ファイアーエムブレム", "日英表記と誤字を同時に吸収する");
  equal(fireEmblem.createNew, false, "日英表記の一致では新規フォルダーを作らない");

  const crossScriptSequel = classifyProject("Dragon Quest Ⅱ", [
    { name: "ドラゴンクエスト", aliases: [], learnedAliases: [] },
  ]);
  equal(
    crossScriptSequel.createNew,
    true,
    "日英表記が一致しても番号付きの別作品は既存フォルダーへ含めない",
  );

  const crossScriptDifferentSequel = classifyProject("Dragon Quest Ⅲ", [
    { name: "ドラゴンクエストⅡ", aliases: [], learnedAliases: [] },
  ]);
  equal(
    crossScriptDifferentSequel.createNew,
    true,
    "日英表記で異なる作品番号を近似一致させない",
  );

  equal(
    matchesProjectSearch("Dragon Quest", ["ドラゴンクエスト"]),
    true,
    "サイドバー検索でも英語から日本語名を検索する",
  );
  equal(
    matchesProjectSearch("ファイアーエムブレム", ["Fire Emblem"]),
    true,
    "サイドバー検索でも日本語から英語名を検索する",
  );
  equal(
    matchesProjectSearch("Dragon Quest", ["ファイナルファンタジー"]),
    false,
    "無関係な日英タイトルは一致させない",
  );
  equal(
    matchesProjectSearch("---", ["Dragon Quest"]),
    false,
    "記号だけの検索を全件一致にしない",
  );

  const exact = classifyProject("【実況】Pokémon Scarlet #1", projects);
  equal(exact.projectName, "ポケットモンスター", "手動別名の包含一致");
  equal(exact.matchType, "exact", "包含一致の種別");

  const typo = classifyProject("Pockets Monsters Scarlet 実況", projects);
  equal(typo.projectName, "ポケットモンスター", "編集距離による表記ゆれ");
  equal(typo.matchType, "fuzzy", "近似一致の種別");

  const learned = classifyProject("Tears of Kingdom 実況プレイ", projects);
  equal(learned.projectName, "ゼルダの伝説", "学習済み別名を照合する");
  equal(learned.createNew, false, "学習済み別名では新規作成しない");

  const unrelated = classifyProject("スーパーマリオブラザーズ ワンダー", projects);
  equal(unrelated.createNew, true, "低スコアなら新規フォルダーにする");
  equal(
    unrelated.projectName,
    "スーパーマリオブラザーズ ワンダー",
    "新規フォルダーにはプレイリスト名を使う",
  );

  const ambiguous = classifyProject("Pokemon 実況", [
    { name: "赤", aliases: ["Pokemon"], learnedAliases: [] },
    { name: "青", aliases: ["Pokemon"], learnedAliases: [] },
  ]);
  equal(ambiguous.createNew, true, "同一スコアの候補が拮抗したら新規作成する");
  equal(ambiguous.matchType, "ambiguous", "候補拮抗の種別");

  const longest = classifyProject("Zelda BOTW", [
    { name: "Zelda", aliases: [], learnedAliases: [] },
    { name: "Breath of the Wild", aliases: ["Zelda BOTW"], learnedAliases: [] },
  ]);
  equal(longest.projectName, "Breath of the Wild", "完全一致では最長の候補を優先する");

  const numberedSequel = classifyProject("FINAL FANTASY Ⅱ", [
    {
      name: "FINAL FANTASY",
      aliases: [],
      learnedAliases: ["FINAL FANTASY Ⅱ"],
    },
  ]);
  equal(numberedSequel.createNew, true, "番号付きの別作品は既存フォルダーへ含めない");
  equal(numberedSequel.projectName, "FINAL FANTASY Ⅱ", "番号付き作品には新規フォルダーを作る");

  const attachedSequelNumber = classifyProject("FINAL FANTASYⅡ", [
    { name: "FINAL FANTASY", aliases: [], learnedAliases: [] },
  ]);
  equal(attachedSequelNumber.createNew, true, "空白なしの作品番号も別作品として扱う");

  const unnumberedPrequel = classifyProject("FINAL FANTASY", [
    { name: "FINAL FANTASY Ⅱ", aliases: [], learnedAliases: [] },
  ]);
  equal(unnumberedPrequel.createNew, true, "番号なし作品も番号付きフォルダーへ含めない");

  const differentSequel = classifyProject("FINAL FANTASY Ⅲ 実況 #1", [
    { name: "FINAL FANTASY Ⅱ", aliases: [], learnedAliases: [] },
  ]);
  equal(differentSequel.createNew, true, "異なる作品番号を近似一致させない");

  const sameSequel = classifyProject("FINAL FANTASY Ⅱ REMAKE 実況 #1", [
    { name: "FINAL FANTASY Ⅱ", aliases: [], learnedAliases: [] },
  ]);
  equal(sameSequel.projectName, "FINAL FANTASY Ⅱ", "同じ作品番号の副題や話数は許可する");
  equal(sameSequel.createNew, false, "同じ番号の作品は既存フォルダーへ分類する");

  const episodeNumber = classifyProject("Minecraft #1", [
    { name: "Minecraft", aliases: [], learnedAliases: [] },
  ]);
  equal(episodeNumber.projectName, "Minecraft", "#付きの話数を作品番号として扱わない");

  const mixLabel = classifyProject("作業用BGM MIX", [
    { name: "作業用BGM", aliases: [], learnedAliases: [] },
  ]);
  equal(mixLabel.projectName, "作業用BGM", "MIXをローマ数字の作品番号として扱わない");

  const learningProject = { name: "正式名", aliases: [], learnedAliases: [] };
  equal(rememberLearnedAlias(learningProject, "実況での表記"), true, "別名を学習する");
  equal(rememberLearnedAlias(learningProject, "実況での表記"), false, "重複学習を防ぐ");
  equal(learningProject.learnedAliases.length, 1, "学習済み別名をDBに保持する");

  equal(
    rememberProjectAlias(learningProject, "実況での表記"),
    true,
    "手動訂正した表記を通常の別名に昇格する",
  );
  equal(learningProject.aliases[0], "実況での表記", "昇格した別名を編集可能な別名に保持する");
  equal(learningProject.learnedAliases.length, 0, "通常の別名と学習済み別名を重複させない");
  equal(
    rememberProjectAlias(learningProject, "実況での表記"),
    false,
    "通常の別名の重複追加を防ぐ",
  );
  equal(rememberProjectAlias(learningProject, "正式名"), false, "正式名自体は別名に追加しない");

  const correctedProjects = [
    {
      name: "誤分類フォルダー",
      aliases: [],
      learnedAliases: ["Pokémon Legends Z-A 実況"],
    },
    {
      name: "ポケットモンスター",
      aliases: [],
      learnedAliases: [],
    },
  ];
  equal(
    rememberProjectCorrection(
      correctedProjects,
      "誤分類フォルダー",
      "ポケットモンスター",
      "Pokémon Legends Z-A 実況",
    ),
    true,
    "追加直後の手動移動を移動先の別名として記録する",
  );
  equal(
    correctedProjects[0].learnedAliases.length,
    0,
    "訂正した表記を誤分類元の学習済み別名から取り除く",
  );
  equal(
    classifyProject("Pokémon Legends Z-A 実況 #2", correctedProjects).projectName,
    "ポケットモンスター",
    "訂正後の類似プレイリストを移動先へ分類する",
  );

  const output = failures.length
    ? `FAIL ${failures.length}/${assertions}\n${failures.join("\n")}`
    : `PASS ${assertions}/${assertions}`;
  document.querySelector("#result").textContent = output;
  document.title = failures.length ? "FAIL" : "PASS";
</script>
