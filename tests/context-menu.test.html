<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<iframe style="width: 1200px; height: 800px; border: 0"></iframe>
<script src="backup-test-helper.js"></script>
<script>
  const now = "2026-07-27T00:00:00.000Z";
  const testData = {
    version: 1,
    updatedAt: now,
    series: [{
      id: "context-menu-series",
      title: "テストプレイリスト",
      channelTitle: "テストチャンネル",
      project: "テストフォルダー",
      thumbnail: "",
      tasks: [],
      createdAt: now,
      updatedAt: now,
    }],
    projects: [{
      name: "テストフォルダー",
      aliases: [],
      learnedAliases: [],
      icon: "builtin:gamepad",
    }],
    playlistOrder: ["context-menu-series"],
  };

  const frame = document.querySelector("iframe");
  frame.addEventListener("load", async () => {
    await loadCuratTestData(frame, testData);
    setTimeout(() => {
      const appDocument = frame.contentDocument;
      const folderRow = appDocument.querySelector("[data-tree-folder='テストフォルダー']");
      folderRow.dispatchEvent(new MouseEvent("contextmenu", {
        bubbles: true,
        cancelable: true,
        clientX: 220,
        clientY: 180,
      }));

      const folderActions = [...appDocument.querySelectorAll("[data-context-action]")]
        .map((item) => [item.dataset.contextAction, item.textContent.trim()]);
      const folderSections = [...appDocument.querySelectorAll(".context-menu-section-label")]
        .map((item) => item.textContent.trim());
      const folderMenuPassed =
        folderSections.join(",") === "作成・編集,検索,表示,管理" &&
        folderActions.some(([action, label]) =>
          action === "new-folder" && label.includes("新しいフォルダーを作成")) &&
        folderActions.some(([action, label]) =>
          action === "edit-folder" && label.includes("フォルダー名を変更")) &&
        folderActions.some(([action, label]) =>
          action === "change-folder-icon" && label.includes("アイコンを変更")) &&
        folderActions.some(([action, label]) =>
          action === "search-same-game" &&
          label.includes("新しいチャンネルのプレイリストを検索")) &&
        folderActions.some(([action]) => action === "expand-folder") &&
        !folderActions.some(([action]) => action === "collapse-folder") &&
        folderActions.some(([action]) => action === "delete-folder");

      appDocument.querySelector("[data-context-action='change-folder-icon']").click();
      setTimeout(() => {
        const iconFocusPassed =
          appDocument.querySelector("#folderIconDialog").open &&
          !appDocument.querySelector("#renameFolderDialog").open &&
          appDocument.activeElement === appDocument.querySelector("#folderIconSearch");
        appDocument.querySelector("#folderIconDialog .close-button").click();

        const playlist = appDocument.querySelector("[data-project-series='context-menu-series']");
        playlist.dispatchEvent(new MouseEvent("contextmenu", {
          bubbles: true,
          cancelable: true,
          clientX: 250,
          clientY: 240,
        }));
        const playlistActions = [...appDocument.querySelectorAll("[data-context-action]")]
          .map((item) => [item.dataset.contextAction, item.textContent.trim()]);
        const playlistSections = [...appDocument.querySelectorAll(".context-menu-section-label")]
          .map((item) => item.textContent.trim());
        const playlistMenuPassed =
          playlistSections.join(",") === "再生,検索,整理,管理" &&
          playlistActions.some(([action, label]) =>
            action === "search-same-game" &&
            label.includes("別の投稿者で同じゲームを検索")) &&
          playlistActions.some(([action, label]) =>
            action === "move-playlist" && label.includes("プレイリストを移動")) &&
          playlistActions.some(([action]) => action === "delete-playlist");

        const passed = folderMenuPassed && iconFocusPassed && playlistMenuPassed;
        document.querySelector("#result").textContent = passed
          ? "PASS context menus group explicit folder and playlist actions"
          : `FAIL folder=${folderMenuPassed} iconFocus=${iconFocusPassed} playlist=${playlistMenuPassed}`;
        document.title = passed ? "PASS" : "FAIL";
      }, 50);
    }, 50);
  }, { once: true });
  frame.src = "../index.html";
</script>
