<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<iframe src="../index.html" hidden></iframe>
<script>
  const frame = document.querySelector("iframe");
  frame.addEventListener("load", () => {
    setTimeout(async () => {
      try {
        const appDocument = frame.contentDocument;

        const loadBtn = appDocument.querySelector("#settingsForm #loadDataJson");
        const exists = Boolean(loadBtn);
        const isButtonType = loadBtn?.type === "button";

        loadBtn.click();
        let saved = null;
        for (let attempt = 0; attempt < 20; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, 50));
          saved = JSON.parse(frame.contentWindow.localStorage.getItem("playlog:data:v1") || "null");
          if (Array.isArray(saved?.series) && saved.series.length > 0) break;
        }

        const dataLoaded = Array.isArray(saved?.series) && saved.series.length > 0;

        const passed = exists && isButtonType && dataLoaded;
        document.querySelector("#result").textContent = passed
          ? "PASS settings load data.json works correctly"
          : `FAIL exists=${exists} isButtonType=${isButtonType} dataLoaded=${dataLoaded}`;
        document.title = passed ? "PASS" : "FAIL";
      } catch (error) {
        document.querySelector("#result").textContent = `FAIL error=${error.message}`;
        document.title = "FAIL";
      }
    }, 500);
  });
</script>
