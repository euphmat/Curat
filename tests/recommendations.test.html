<!doctype html>
<meta charset="utf-8" />
<title>recommendations tests</title>
<pre id="result">running</pre>
<script src="../recommendations.js"></script>
<script>
  const {
    RECOMMENDATION_TYPES,
    buildRecommendationProfile,
    diversifyRecommendationChannels,
    isRecommendationChannelRegistered,
    recommendationChannelKey,
    recommendationGameKey,
    recommendationPlaylistKey,
    recommendationVideoKey,
    rankRecommendationCandidates,
    rankRecommendationCandidatesByType,
    scoreRecommendationCandidate,
  } = window.CuratRecommendations;
  const failures = [];
  let assertions = 0;

  function equal(actual, expected, message) {
    assertions += 1;
    if (actual !== expected) {
      failures.push(`${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }
  }

  const baseSeries = [
    {
      id: "registered",
      project: "ゼルダの伝説",
      title: "ゼルダの伝説 実況",
      channelId: "channel-a",
      channelTitle: "実況者A",
      tasks: [{ status: "todo" }],
    },
  ];
  const projects = [
    { name: "ゼルダの伝説", aliases: ["The Legend of Zelda"], learnedAliases: [] },
  ];
  const candidates = [
    {
      id: "registered",
      title: "登録済み",
      channelId: "channel-a",
      channelTitle: "実況者A",
      itemCount: 20,
    },
    {
      id: "same-channel",
      title: "新作ゲーム 実況プレイ",
      channelId: "channel-a",
      channelTitle: "実況者A",
      itemCount: 30,
    },
    {
      id: "same-project",
      title: "The Legend of Zelda 完全実況",
      channelId: "channel-b",
      channelTitle: "実況者B",
      itemCount: 40,
    },
  ];

  const todoProfile = buildRecommendationProfile(baseSeries, projects);
  const todoRanked = rankRecommendationCandidates(candidates, todoProfile);
  equal(todoRanked.some((item) => item.id === "registered"), false, "登録済み候補を除外する");
  equal(todoRanked[0].id, "same-project", "未登録の投稿者による関連候補を優先する");
  equal(
    todoRanked.find((item) => item.id === "same-project").channelRelationship,
    "new",
    "未登録の投稿者を判定する",
  );
  equal(
    todoRanked.find((item) => item.id === "same-project").recommendationType,
    "new-channel",
    "登録済みゲームと未登録投稿者を新しい投稿者に分類する",
  );
  equal(
    todoRanked.find((item) => item.id === "same-channel").channelRelationship,
    "known",
    "登録済みと同じ投稿者を判定する",
  );
  equal(
    todoRanked.find((item) => item.id === "same-channel").recommendationType,
    "new-game",
    "登録済み投稿者の未登録ゲームを新しいゲームに分類する",
  );
  equal(
    recommendationGameKey(todoRanked.find((item) => item.id === "same-channel")) ===
      recommendationGameKey({
        title: "新作ゲーム 実況プレイ Part 2",
        channelTitle: "実況者A",
      }),
    true,
    "実況表記やPart番号が違っても同じ新しいゲームとして識別する",
  );
  equal(
    recommendationChannelKey(
      todoRanked.find((item) => item.id === "same-channel"),
    ),
    "id:channel-a",
    "チャンネルIDを除外用の識別子にする",
  );
  equal(
    isRecommendationChannelRegistered(
      { channelId: "channel-a", channelTitle: "別表記" },
      baseSeries,
    ),
    true,
    "チャンネルIDが登録済みなら投稿者を除外できる",
  );
  equal(
    isRecommendationChannelRegistered(
      { channelTitle: "実況者Ａ" },
      [{ channelTitle: "実況者A" }],
    ),
    true,
    "IDがない場合は正規化した投稿者名で除外できる",
  );
  equal(
    isRecommendationChannelRegistered(
      { channelId: "new-channel", channelTitle: "新しい実況者" },
      baseSeries,
    ),
    false,
    "未登録の投稿者は検索候補に残す",
  );
  equal(
    recommendationVideoKey(
      todoRanked.find((item) => item.id === "same-channel"),
    ),
    "id:same-channel",
    "旧名称でもプレイリストIDの除外識別子を返す",
  );
  equal(
    recommendationPlaylistKey(
      todoRanked.find((item) => item.id === "same-channel"),
    ),
    "id:same-channel",
    "プレイリストIDを個別プレイリストの除外識別子にする",
  );
  equal(
    scoreRecommendationCandidate(
      {
        id: "known-channel-known-game",
        title: "ゼルダの伝説 実況 Part 2",
        channelId: "channel-a",
        channelTitle: "実況者A",
        itemCount: 20,
      },
      todoProfile,
    ).recommendationType,
    "known-channel",
    "登録済み投稿者による登録済みゲームを追加済み投稿者に分類する",
  );
  equal(
    scoreRecommendationCandidate(
      {
        id: "new-game-new-channel",
        title: "完全新規ゲーム 実況プレイ",
        channelId: "brand-new-channel",
        channelTitle: "初めての投稿者",
        itemCount: 20,
      },
      todoProfile,
    ).recommendationType,
    "new-game-new-channel",
    "ゲームと投稿者の両方が未登録なら専用タブに分類する",
  );
  equal(
    todoRanked.find((item) => item.id === "same-project").reasons[0],
    "登録済みの「ゼルダの伝説」に関連",
    "作品との関連理由を表示する",
  );

  const diversityRanked = rankRecommendationCandidates(
    [
      ...Array.from({ length: 4 }, (_, index) => ({
        id: `known-${index}`,
        title: `実況者Aの実況 ${index}`,
        channelId: "channel-a",
        channelTitle: "実況者A",
        itemCount: 100 - index,
      })),
      {
        id: "only-new-channel",
        title: "ゼルダの伝説 実況",
        channelId: "channel-new",
        channelTitle: "新しい実況者",
        itemCount: 2,
      },
    ],
    todoProfile,
    3,
  );
  equal(
    diversityRanked.some((item) => item.id === "only-new-channel"),
    true,
    "同じ投稿者の高評価候補が多くても未登録投稿者を結果に含める",
  );

  const newGameDiversityRanked = rankRecommendationCandidates(
    [
      ...Array.from({ length: 4 }, (_, index) => ({
        id: `new-channel-${index}`,
        title: `ゼルダの伝説 実況 ${index}`,
        channelId: `channel-new-${index}`,
        channelTitle: `新しい実況者${index}`,
        sourceProjectNames: new Set(["ゼルダの伝説"]),
        itemCount: 100 - index,
      })),
      {
        id: "only-new-game",
        title: "未登録ゲーム 実況",
        channelId: "channel-a",
        channelTitle: "実況者A",
        itemCount: 2,
      },
    ],
    todoProfile,
    3,
  );
  equal(
    newGameDiversityRanked.some((item) => item.id === "only-new-game"),
    true,
    "未登録投稿者の候補が多くても新しいゲームを結果に含める",
  );

  const allTabsRanked = rankRecommendationCandidates(
    [
      ...Array.from({ length: 6 }, (_, index) => ({
        id: `crowded-new-channel-${index}`,
        title: `ゼルダの伝説 実況 ${index}`,
        channelId: `crowded-channel-${index}`,
        channelTitle: `発見実況者${index}`,
        sourceProjectNames: new Set(["ゼルダの伝説"]),
        itemCount: 100 - index,
      })),
      {
        id: "seed-new-game",
        title: "未登録ゲーム 実況",
        channelId: "channel-a",
        channelTitle: "実況者A",
        itemCount: 2,
      },
      {
        id: "seed-known-channel",
        title: "ゼルダの伝説 番外編",
        channelId: "channel-a",
        channelTitle: "実況者A",
        itemCount: 2,
      },
      {
        id: "seed-new-game-new-channel",
        title: "完全新規ゲーム 実況",
        channelId: "completely-new-channel",
        channelTitle: "完全新規投稿者",
        itemCount: 20,
      },
    ],
    todoProfile,
    4,
  );
  equal(
    new Set(allTabsRanked.map((item) => item.recommendationType)).size,
    4,
    "候補がある場合は4タブすべての項目を結果に残す",
  );

  const gameDiversityProfile = buildRecommendationProfile(
    [
      {
        id: "registered-a",
        project: "ゲームA",
        channelId: "registered-channel",
        channelTitle: "登録済み実況者",
      },
      {
        id: "registered-b",
        project: "ゲームB",
        channelId: "registered-channel",
        channelTitle: "登録済み実況者",
      },
      {
        id: "registered-c",
        project: "ゲームC",
        channelId: "registered-channel",
        channelTitle: "登録済み実況者",
      },
    ],
    [],
  );
  const gameDiversityRanked = rankRecommendationCandidates(
    [
      ...Array.from({ length: 5 }, (_, index) => ({
        id: `game-a-${index}`,
        title: `ゲームA 実況 Part ${index + 1}`,
        channelId: `new-channel-a-${index}`,
        channelTitle: `ゲームA実況者${index}`,
        itemCount: 100 - index,
      })),
      {
        id: "game-b",
        title: "ゲームB 実況",
        channelId: "new-channel-b",
        channelTitle: "ゲームB実況者",
        itemCount: 10,
      },
      {
        id: "game-c",
        title: "ゲームC 実況",
        channelId: "new-channel-c",
        channelTitle: "ゲームC実況者",
        itemCount: 5,
      },
    ],
    gameDiversityProfile,
    3,
  );
  equal(
    new Set(gameDiversityRanked.map((item) => item.gameKey)).size,
    3,
    "同じゲームの高評価候補が多くても異なるゲームを優先して表示する",
  );
  const singleGameRanked = rankRecommendationCandidates(
    Array.from({ length: 4 }, (_, index) => ({
      id: `single-game-${index}`,
      title: `ゲームA 実況 Part ${index + 1}`,
      channelId: `single-game-channel-${index}`,
      channelTitle: `実況者${index}`,
      itemCount: 20 - index,
    })),
    gameDiversityProfile,
    3,
  );
  equal(
    singleGameRanked.length,
    3,
    "別ゲームの候補がない場合は同じゲームでも表示枠を埋める",
  );
  const channelDiversified = diversifyRecommendationChannels([
    ...Array.from({ length: 4 }, (_, index) => ({
      id: `channel-a-playlist-${index}`,
      channelId: "channel-a",
    })),
    { id: "channel-b-playlist", channelId: "channel-b" },
    { id: "channel-c-playlist", channelId: "channel-c" },
  ]);
  equal(
    new Set(channelDiversified.slice(0, 3).map((item) => item.channelId)).size,
    3,
    "同じ投稿者の候補が多くても別の投稿者を先に表示する",
  );

  const dismissedGameKey = recommendationGameKey(
    todoRanked.find((item) => item.id === "same-project"),
  );
  const withoutDismissedGame = rankRecommendationCandidates(
    candidates,
    todoProfile,
    12,
    { games: [dismissedGameKey], channels: [] },
  );
  equal(
    withoutDismissedGame.some((item) => item.id === "same-project"),
    false,
    "表示しないゲームを候補から除外する",
  );

  const withoutDismissedChannel = rankRecommendationCandidates(
    candidates,
    todoProfile,
    12,
    { games: [], channels: ["id:channel-a"] },
  );
  equal(
    withoutDismissedChannel.some((item) => item.id === "same-channel"),
    false,
    "表示しないチャンネルを候補から除外する",
  );

  const withoutDismissedPlaylist = rankRecommendationCandidates(
    candidates,
    todoProfile,
    12,
    { playlists: ["id:same-channel"], games: [], channels: [] },
  );
  equal(
    withoutDismissedPlaylist.some((item) => item.id === "same-channel"),
    false,
    "表示しないプレイリストだけを候補から除外する",
  );
  equal(
    withoutDismissedPlaylist.some((item) => item.id === "same-project"),
    true,
    "個別プレイリストの除外では別の候補を残す",
  );
  const withoutLegacyDismissedVideo = rankRecommendationCandidates(
    candidates,
    todoProfile,
    12,
    { videos: ["id:same-channel"], games: [], channels: [] },
  );
  equal(
    withoutLegacyDismissedVideo.some((item) => item.id === "same-channel"),
    false,
    "旧形式の個別除外データも引き続き適用する",
  );

  const rotatingCandidates = [
    ...Array.from({ length: 16 }, (_, index) => ({
      id: `rotation-new-channel-${index}`,
      title: `ゼルダの伝説 実況 ${index}`,
      channelId: `rotation-channel-${index}`,
      channelTitle: `新しい実況者${index}`,
      sourceProjectNames: new Set(["ゼルダの伝説"]),
      itemCount: 100 - index,
    })),
    ...Array.from({ length: 16 }, (_, index) => ({
      id: `rotation-known-channel-${index}`,
      title: `ゼルダの伝説 実況 Part ${index + 1}`,
      channelId: "channel-a",
      channelTitle: "実況者A",
      itemCount: 100 - index,
    })),
    ...Array.from({ length: 16 }, (_, index) => ({
      id: `rotation-new-game-${index}`,
      title: `未登録ゲーム${index} 実況`,
      channelId: "channel-a",
      channelTitle: "実況者A",
      itemCount: 100 - index,
    })),
    ...Array.from({ length: 16 }, (_, index) => ({
      id: `rotation-new-game-new-channel-${index}`,
      title: `完全新規ゲーム${index} 実況`,
      channelId: `rotation-completely-new-channel-${index}`,
      channelTitle: `完全新規投稿者${index}`,
      itemCount: 100 - index,
    })),
  ];
  const firstRotation = rankRecommendationCandidatesByType(
    rotatingCandidates,
    todoProfile,
    8,
  );
  const secondRotation = rankRecommendationCandidatesByType(
    rotatingCandidates,
    todoProfile,
    8,
    {},
    firstRotation.map((item) => item.id),
  );
  equal(RECOMMENDATION_TYPES.length, 4, "おすすめ分類を4種類公開する");
  for (const type of RECOMMENDATION_TYPES) {
    const firstIds = new Set(
      firstRotation
        .filter((item) => item.recommendationType === type)
        .map((item) => item.id),
    );
    const secondItems = secondRotation.filter(
      (item) => item.recommendationType === type,
    );
    equal(secondItems.length, 8, `${type}を更新ごとに8件表示する`);
    equal(
      secondItems.some((item) => firstIds.has(item.id)),
      false,
      `${type}は候補が十分なら前回と異なる8件を表示する`,
    );
  }

  const doneSeries = structuredClone(baseSeries);
  doneSeries[0].tasks[0].status = "done";
  const doneRanked = rankRecommendationCandidates(
    candidates,
    buildRecommendationProfile(doneSeries, projects),
  );
  equal(
    JSON.stringify(doneRanked),
    JSON.stringify(todoRanked),
    "視聴状況が変わってもおすすめ結果を変えない",
  );

  document.querySelector("#result").textContent = failures.length
    ? `FAIL ${failures.join("\n")}`
    : `PASS ${assertions}/${assertions}`;
  document.title = failures.length ? "FAIL" : "PASS";
</script>
