<!doctype html>
<meta charset="utf-8" />
<title>RUNNING</title>
<pre id="result">running</pre>
<iframe src="../index.html" hidden></iframe>
<script>
  const frame = document.querySelector("iframe");
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    doc.querySelector("#newProject").click();
    const input = doc.querySelector("#folderIconSearch");
    input.value = "game";
    input.dispatchEvent(new Event("input", { bubbles: true }));
    setTimeout(() => {
      const options = doc.querySelectorAll("#folderIconResults [data-folder-icon]");
      const remote = [...options].some((option) => !option.dataset.folderIcon.startsWith("builtin:"));
      document.querySelector("#result").textContent = remote
        ? `PASS ${options.length} results`
        : `FAIL ${options.length} results`;
      document.title = remote ? "PASS" : "FAIL";
    }, 2200);
  }, { once: true });
</script>
